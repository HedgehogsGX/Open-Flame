name: offline-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.12.10"
          - "3.13.14"
    env:
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
      UV_NO_SYNC: "1"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false

      - name: Verify commit scope
        run: python scripts/verify_commit_scope.py --github-event

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.25"
          enable-cache: false

      - name: Verify CI definition
        run: python scripts/verify_ci_contract.py

      - name: Verify runtime identities
        run: |
          python --version
          node --version
          uv --version

      - name: Install the locked development environment
        run: uv sync --extra dev --locked --python "${{ matrix.python-version }}"

      - name: Verify the dependency environment
        run: uv pip check

      - name: Verify the matrix test environment
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: uv run python -c "import os, pytest, sys; actual='.'.join(map(str, sys.version_info[:3])); print(f'python={actual} pytest={pytest.__version__}'); assert actual == os.environ['EXPECTED_PYTHON']"

      - name: Run the offline test suite
        run: uv run python -m pytest -q

      - name: Check source whitespace
        run: git diff --check

      - name: Check committed source whitespace
        run: git diff-tree --check --root -r -m --no-commit-id HEAD
